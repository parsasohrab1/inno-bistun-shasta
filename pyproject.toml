[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "models", ".venv"]

[tool.ruff.lint]
# Focus on real bugs / undefined names; style is not gated in CI.
select = ["E9", "F", "I"]
ignore = ["F401", "F841"]  # unused imports/vars: warn only, don't fail CI

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
